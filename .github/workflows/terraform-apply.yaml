name: terraform-apply

permissions:
  id-token: write
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  WEBAPP_IMAGE_NAME: "accounting-ingest-webapp"
  WEBAPI_IMAGE_NAME: "accounting-ingest-webapi"
  GCP_PROJECT_ID: "${{ secrets.GCP_REPO_ID }}"
  GCP_REGION: "europe-west2"
  REPO_NAME: "cloud-run-services"

jobs:
  terraform_apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.6.6

      - name: Fetch GCP Key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT_EMAIL }}"

      - name: Set permissions for the credentials file
        run: chmod 644 $GOOGLE_APPLICATION_CREDENTIALS

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Web App Docker Image
        run: |
          docker build \
            --target web-app \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPP_IMAGE_NAME }}:${{ github.run_number }} \
            .
          docker tag \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPP_IMAGE_NAME }}:${{ github.run_number }} \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPP_IMAGE_NAME }}:latest

      - name: Build Web API Docker Image
        run: |
          docker build \
            --target web-api \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPI_IMAGE_NAME }}:${{ github.run_number }} \
            .
          docker tag \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPI_IMAGE_NAME }}:${{ github.run_number }} \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPI_IMAGE_NAME }}:latest

      - name: Push Docker Images to Artifact Registry
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPP_IMAGE_NAME }}:${{ github.run_number }} 
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPP_IMAGE_NAME }}:latest
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPI_IMAGE_NAME }}:${{ github.run_number }} 
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.WEBAPI_IMAGE_NAME }}:latest

      - name: Terraform apply
        run: |
          cd ./terraform
          echo "Initializing Terraform..."
          terraform init

          echo "Validating Terraform..."
          terraform validate

          echo "Running Terraform plan..."
          terraform apply \
            -input=false \
            -auto-approve \
            -var="image_tag=${{ github.run_number }}" \
            -var="image_name=${{ env.WEBAPP_IMAGE_NAME }}" \
            -var="api_image_name=${{ env.WEBAPI_IMAGE_NAME }}" \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="repo_name=${{ env.REPO_NAME }}" \
            -var="iap_user_email=${{ secrets.IAP_USER_EMAIL }}"
