<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Accounting WebApp{% endblock %}</title>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>

<body>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="toast toast-custom align-items-center text-white bg-{{ 'success' if category == 'success' else ('warning text-dark' if category == 'warning' else 'danger') }} border-0 show"
            role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    {{ message }}
                </div>
                <button type="button"
                    class="btn-close {{ 'btn-close-white' if category != 'warning' else '' }} me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'))
            toastElList.map(function (toastEl) {
                return new bootstrap.Toast(toastEl, { delay: 6000 }).show()
            })
        })
    </script>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home_page.home') }}">
                <span class="brand-icon">§</span>
                <span>LedgerApp</span>
            </a>
            {% if session.get('logged_in') %}
            <div class="d-flex align-items-center gap-2">
                <a href="{{ url_for('accounting_pages.list_transactions') }}" class="nav-link-custom">Transactions</a>
                <a href="{{ url_for('accounting_pages.new_transaction') }}" class="nav-link-custom">+ Entry</a>
                <a href="{{ url_for('login_page.logout') }}" class="btn btn-outline-secondary btn-sm ms-2">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
